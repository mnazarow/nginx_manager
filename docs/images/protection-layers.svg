<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 736" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker>
    <style>.ext{fill:#f4f3ef;stroke:#8f8e86;stroke-width:1.2;stroke-dasharray:6 4}.k{fill:#f1ecfb;stroke:#7a52c7;stroke-width:1.2}.b{fill:#fdeeee;stroke:#c93a3a;stroke-width:1.2}.w{fill:#fff4e0;stroke:#c7820a;stroke-width:1.2}.c{fill:#e6f0fc;stroke:#2a78d6;stroke-width:1.2}.g{fill:#e5f5e5;stroke:#0ca30c;stroke-width:1.4}.f{fill:#fff;stroke:#c3c2b7;stroke-width:1.2}.t{font-weight:600;font-size:14px;fill:#0b0b0b}.s{fill:#3d3c39;font-size:12px}.n{font-weight:700;font-size:13px;fill:#52514e}.tag{fill:#52514e;font-size:11.5px}.l{stroke:#52514e;stroke-width:1.4;fill:none;marker-end:url(#a)}.lab{fill:#52514e;font-size:11.5px}</style>
  </defs>
  <rect width="1100" height="736" fill="#fcfcfb"/>
  <text x="550" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#0b0b0b">Эшелонированная защита: что и где отражается</text>
  <text x="550" y="56" text-anchor="middle" class="s">запрос проходит слои сверху вниз; отклонённый слоем запрос не доходит ни до следующих слоёв, ни до бэкенда</text>
  <rect class="f" x="180" y="70" width="640" height="30" rx="8"/><text class="t" x="500" y="90" text-anchor="middle">Интернет: посетители, поисковые роботы, сканеры, бот-сети</text>
  <line class="l" x1="500" y1="102" x2="500" y2="112"/>
  <rect class="ext" x="180" y="112" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="140" text-anchor="end">L3/L4</text>
  <text class="t" x="194" y="131">Провайдер или сеть очистки трафика</text>
  <text class="s" x="194" y="149">объёмный DDoS (Гбит/с) — до сервера: Cloudflare, DDoS-Guard, Qrator</text>
  <text class="tag" x="808" y="131" text-anchor="end">вне сервера</text>
  <line class="l" x1="500" y1="158" x2="500" y2="168"/>
  <rect class="k" x="180" y="168" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="196" text-anchor="end">1</text>
  <text class="t" x="194" y="187">Ядро Linux</text>
  <text class="s" x="194" y="205">SYN cookies, очереди соединений, rp_filter → SYN-флуд, подмена адресов</text>
  <text class="tag" x="808" y="187" text-anchor="end">Сеть и сервер</text>
  <line class="l" x1="500" y1="214" x2="500" y2="224"/>
  <rect class="k" x="180" y="224" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="252" text-anchor="end">2</text>
  <text class="t" x="194" y="243">nginx: соединения</text>
  <text class="s" x="194" y="261">таймауты, сброс зависших, limit_conn → Slowloris, R.U.D.Y., Slow Read</text>
  <text class="tag" x="808" y="243" text-anchor="end">Сеть и сервер</text>
  <line class="l" x1="500" y1="270" x2="500" y2="280"/>
  <rect class="b" x="180" y="280" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="308" text-anchor="end">3</text>
  <text class="t" x="194" y="299">Блокировки IP и доступ по странам</text>
  <text class="s" x="194" y="317">geo-таблицы bans.conf и GeoIP → известные нарушители, регионы</text>
  <text class="tag" x="808" y="299" text-anchor="end">глава 17</text>
  <line class="l" x1="500" y1="326" x2="500" y2="336"/>
  <rect class="b" x="180" y="336" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="364" text-anchor="end">4</text>
  <text class="t" x="194" y="355">Списки угроз</text>
  <text class="s" x="194" y="373">Spamhaus, FireHOL, Tor, blocklist.de… → бот-сети, захваченные сети</text>
  <text class="tag" x="808" y="355" text-anchor="end">Списки угроз</text>
  <line class="l" x1="500" y1="382" x2="500" y2="392"/>
  <rect class="w" x="180" y="392" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="420" text-anchor="end">5</text>
  <text class="t" x="194" y="411">Фильтр запросов (WAF)</text>
  <text class="s" x="194" y="429">98 сигнатур, 22 категории, 40 CVE → SQLi, XSS, RCE, Log4Shell, сканеры</text>
  <text class="tag" x="808" y="411" text-anchor="end">Фильтр запросов</text>
  <line class="l" x1="500" y1="438" x2="500" y2="448"/>
  <rect class="w" x="180" y="448" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="476" text-anchor="end">6</text>
  <text class="t" x="194" y="467">Свои правила · хотлинкинг · Host/SNI · заголовки</text>
  <text class="s" x="194" y="485">условие → действие; httpoxy, X-Original-URL, CVE-2025-29927</text>
  <text class="tag" x="808" y="467" text-anchor="end">Свои правила</text>
  <line class="l" x1="500" y1="494" x2="500" y2="504"/>
  <rect class="c" x="180" y="504" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="532" text-anchor="end">7</text>
  <text class="t" x="194" y="523">Проверка браузера, «Под атакой»</text>
  <text class="s" x="194" y="541">proof-of-work + пропуск secure_link → L7-флуд, боты без браузера</text>
  <text class="tag" x="808" y="523" text-anchor="end">Проверка браузера</text>
  <line class="l" x1="500" y1="550" x2="500" y2="560"/>
  <rect class="c" x="180" y="560" width="640" height="46" rx="8"/>
  <text class="n" x="164" y="588" text-anchor="end">8</text>
  <text class="t" x="194" y="579">Ограничение частоты, формы входа</text>
  <text class="s" x="194" y="597">limit_req, 429 → перебор паролей, сбор данных, флуд с одного IP</text>
  <text class="tag" x="808" y="579" text-anchor="end">вкладка сайта</text>
  <line class="l" x1="500" y1="606" x2="500" y2="616"/>
  <rect class="g" x="180" y="616" width="640" height="46" rx="8"/><text class="t" x="500" y="636" text-anchor="middle">Бэкенд сайта</text><text class="s" x="500" y="653" text-anchor="middle">получает только прошедшие проверки запросы</text>
  <rect class="f" x="860" y="330" width="210" height="218" rx="10"/>
  <text class="t" x="965" y="352" text-anchor="middle" font-size="13">Журнал доступа nginx</text>
  <text class="s" x="965" y="373" text-anchor="middle" font-size="12">(поля wf, wa, ch)</text>
  <text class="s" x="965" y="394" text-anchor="middle" font-size="12">↓</text>
  <text class="t" x="965" y="415" text-anchor="middle" font-size="13">Журнал атак, счётчики,</text>
  <text class="s" x="965" y="436" text-anchor="middle" font-size="12">метрики, оповещения</text>
  <text class="s" x="965" y="457" text-anchor="middle" font-size="12">↓</text>
  <text class="t" x="965" y="478" text-anchor="middle" font-size="13">Автоблокировка: N атак</text>
  <text class="s" x="965" y="499" text-anchor="middle" font-size="12">с IP, ловушки, перебор,</text>
  <text class="s" x="965" y="520" text-anchor="middle" font-size="12">сканеры, флуд</text>
  <path class="l" d="M820 583 H965 V554"/>
  <text class="lab" x="828" y="578">каждый запрос</text>
  <path class="l" d="M965 330 V303 H822"/>
  <text class="lab" x="828" y="296">bans.conf → reload</text>
  <rect class="ext" x="180" y="680" width="18" height="14" rx="3"/><text class="lab" x="204" y="692">вне сервера</text>
  <rect class="k" x="311" y="680" width="18" height="14" rx="3"/><text class="lab" x="335" y="692">ядро и соединения</text>
  <rect class="b" x="484" y="680" width="18" height="14" rx="3"/><text class="lab" x="508" y="692">репутация источника</text>
  <rect class="w" x="671" y="680" width="18" height="14" rx="3"/><text class="lab" x="695" y="692">содержимое запроса</text>
  <rect class="c" x="851" y="680" width="18" height="14" rx="3"/><text class="lab" x="875" y="692">поведение клиента</text>
</svg>
